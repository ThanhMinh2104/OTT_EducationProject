name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Backend (TypeScript Check)
        run: |
          cd backend
          npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: PORT,NODE_ENV,MONGO_URI,JWT_SECRET,JWT_EXPIRES,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,EMAIL_USER,EMAIL_PASS,GEMINI_API_KEY,GEMINI_MODEL,INFINIREACH_API_KEY,INFINIREACH_FROM_PHONE
          script: |
            cd ~/OTT_EducationProject
            git checkout main
            git pull origin main

            # Ghi lại toàn bộ file .env từ secrets
            cat > ~/OTT_EducationProject/backend/.env << ENVEOF
PORT=${PORT:-5000}
NODE_ENV=${NODE_ENV:-production}
MONGO_URI=${MONGO_URI}
JWT_SECRET=${JWT_SECRET}
JWT_EXPIRES=${JWT_EXPIRES:-7d}
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
EMAIL_USER=${EMAIL_USER}
EMAIL_PASS=${EMAIL_PASS}
GEMINI_API_KEY=${GEMINI_API_KEY}
GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
INFINIREACH_API_KEY=${INFINIREACH_API_KEY}
INFINIREACH_FROM_PHONE=${INFINIREACH_FROM_PHONE}
ENVEOF

            cd backend
            docker compose down
            docker compose up -d --build
