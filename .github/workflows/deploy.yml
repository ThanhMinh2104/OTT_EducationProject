name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Backend (TypeScript Check)
        run: |
          cd backend
          npm run build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Write .env and Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PORT: ${{ secrets.PORT }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES: ${{ secrets.JWT_EXPIRES }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          INFINIREACH_API_KEY: ${{ secrets.INFINIREACH_API_KEY }}
          INFINIREACH_FROM_PHONE: ${{ secrets.INFINIREACH_FROM_PHONE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: PORT,NODE_ENV,MONGO_URI,JWT_SECRET,JWT_EXPIRES,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,EMAIL_USER,EMAIL_PASS,GEMINI_API_KEY,GEMINI_MODEL,INFINIREACH_API_KEY,INFINIREACH_FROM_PHONE
          script: |
            cd ~/OTT_EducationProject
            git checkout main
            git pull origin main
            ENV_FILE=~/OTT_EducationProject/backend/.env
            printf "PORT=%s\nNODE_ENV=%s\nMONGO_URI=%s\nJWT_SECRET=%s\nJWT_EXPIRES=%s\nCLOUDINARY_CLOUD_NAME=%s\nCLOUDINARY_API_KEY=%s\nCLOUDINARY_API_SECRET=%s\nEMAIL_USER=%s\nEMAIL_PASS=%s\nGEMINI_API_KEY=%s\nGEMINI_MODEL=%s\nINFINIREACH_API_KEY=%s\nINFINIREACH_FROM_PHONE=%s\n" \
              "${PORT:-5000}" \
              "${NODE_ENV:-production}" \
              "$MONGO_URI" \
              "$JWT_SECRET" \
              "${JWT_EXPIRES:-7d}" \
              "$CLOUDINARY_CLOUD_NAME" \
              "$CLOUDINARY_API_KEY" \
              "$CLOUDINARY_API_SECRET" \
              "$EMAIL_USER" \
              "$EMAIL_PASS" \
              "$GEMINI_API_KEY" \
              "${GEMINI_MODEL:-gemini-2.0-flash-lite}" \
              "$INFINIREACH_API_KEY" \
              "$INFINIREACH_FROM_PHONE" > "$ENV_FILE"
            cd backend
            docker compose down
            docker compose up -d --build
